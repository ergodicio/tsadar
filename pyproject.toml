[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "tsadar"
dynamic = ["version"]
description = "Thomson Scattering Analysis software"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Avi Milder", email = "amild@lle.rochester.edu" },
    { name = "Archis Joglekar", email = "archis@ergodic.io" },
]
dependencies = [
    "jax",
    "numpy",
    "scipy",
    "opencv-python",
    "scikit-image",
    "matplotlib",
    "xlrd",
    "pyyaml",
    "mlflow>=3.11.1",
    "boto3",
    "flatten-dict",
    "optax",
    "optimistix",
    "tqdm",
    "jaxopt>=0.6.0",
    "xarray",
    "pandas",
    "interpax",
    "tabulate",
    "psutil",
    "equinox",
    "plotly",
    "typing-extensions",
    "corner",
]

[project.urls]
Homepage = "https://github.com/ergodicio/tsadar"

[project.optional-dependencies]
gpu = [
    "jax[cuda12]",
    "pynvml",
]
hdf = [
    "pyhdf",
]
docs = [
    "sphinx>3.0.0",
    "sphinx_copybutton",
    "sphinx-rtd-theme>=1.0,<2.0",
    "sphinx-github-style>=1.0,<=1.1",
    "sphinx_design",
    "pydata_sphinx_theme",
]
test = [
    "pytest",
]

[tool.hatch.build.targets.wheel]
packages = ["tsadar"]

[tool.hatch.build.targets.sdist]
include = [
    "tsadar",
    "README.md",
    "pyproject.toml",
]

# The version comes from the latest git tag; releases are tagged by .github/workflows/release.yaml
[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
fallback_version = "0+unknown"
