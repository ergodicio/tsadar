# Phase 4d: MYSH with the in-plane polar-harmonic EDF (fd2a4541), flm_type arbitrary, M = 4, trained F0 (single isotropic part, no shape parameter)
# rerun _2: F0 radial function scaled by 1 + v^2 (was 1 + v^4; tail drift), no <v^2> gauge
# Phase 4: MYSH_arbSH with gain mode global_wing (closed-form blue/red scales replace amp1/amp2, now inactive; no gain prior)
# anisotropic recovery test, ported from tsadar-tests-2 HighFluxMY_wrot_test_model_arbSH (same settings as the Maxwellian/SG4 decks);
# data: un-normalized root-aware images of truth deck truth_MYSH (run 8f66a558 with dtx lowered 1e-2 -> 6e-3: no bump-on-tail) + rotated partner, second image rotated by shot_rot
data:
  background:
    slice: 10002
    type: Fit
  lineouts:
    end: 950
    skip: 20
    start: 150
    type: range
  shot_rot: 90.0
  shotnum:
  - 10025
  - 10026
  fit_EPWb: true
  fit_EPWr: true
  fit_IAW: false
  load_ele_spec: true
  load_ion_spec: false
machine: gpu
mlflow:
