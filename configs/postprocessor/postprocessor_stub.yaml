mlflow:
  experiment: shot_day_10_22_25
  run: s116773-mcmc-stat-only-laplaceseed

optimizer:
  # Only read by this standalone MCMC postprocessor's reconstructed loss_fn -- the point estimate in
  # fitted_weights.eqx was already produced under the source run's own optimizer.loss_method (l2) and is
  # loaded unchanged, never re-optimized here. This only changes what neg_log_likelihood MCMC samples
  # against (and what the Laplace/Hessian seed is computed from), per NOISE_MODEL_SESSION_HANDOFF.md
  # Phase 5 -- does NOT touch the point-estimate optimizer (that's Phase 6, still deliberately deferred).
  loss_method: covar

other:
  # Only read by the standalone MCMC uncertainty postprocessor (run_mcmc_postprocessor.py /
  # tsadar.mcmc_postprocess_runner) -- never by a normal fit. All fields are optional and default to
  # what's shown here if this whole section (or any individual field) is omitted, so removing it changes
  # nothing about fitting or the existing Hessian-based postprocessor.
  mcmc:
    num_steps: 8000
    burn_in: 2000
    thin: 5
    # Chunk size burn-in is reported/checkpointed in (tqdm granularity) -- purely cosmetic, since
    # adaptation itself (Vihola's Robust Adaptive Metropolis, see mcmc._ram_update) runs every single
    # step, not once per window.
    adapt_every: 100
    target_accept: 0.234
    # RAM's vanishing-gain exponent (mcmc._ram_update); within Vihola (2012)'s recommended (0.5, 1] range.
    adapt_gamma: 0.6
    # Flat, uncorrelated fallback proposal step (logit space), used only when use_laplace_seed is false or
    # the Laplace/Hessian seed fails structurally -- see mcmc._seed_step_scale_default.
    init_step_scale: 0.1
    use_laplace_seed: true
    # Multiplier on the seeded step scale, used to perturb each independent chain's own starting point
    # before burn-in (see calibration_uncertainty.num_draws below for the chain-count knob). 0.0 (the
    # default) means every chain starts at the exact best fit.
    init_dispersion_factor: 2.0
    seed: 0
    save_samples: true
    compare_to_laplace: true
    # Threshold, in robust-SD units (1.4826 * MAD), for flagging one chain's per-lineout posterior mean
    # as an outlier relative to the other independent chains -- Iglewicz & Hoaglin's standard modified
    # z-score cutoff. See mcmc_postprocess._mad_flagged_chains; meaningless with calibration_uncertainty.
    # num_draws == 1 (nothing to compare against).
    chain_outlier_mad_scale: 3.5
    # Threshold for a *within*-chain split-R-hat: whether a single chain's own first half and second half
    # of post-burn-in samples agree, catching a chain that never reached a stationary distribution at all
    # (invisible to chain_outlier_mad_scale, which only ever compares chains to each other) -- see
    # mcmc._within_chain_r_hat. More lenient than the usual 1.01 many-chain target since split-R-hat here
    # only ever compares two halves of one chain.
    within_chain_r_hat_threshold: 1.1
    # Hard cap, as a fraction of the chain count, on how many chains this postprocessor will write off
    # (for either reason above, combined) before giving up on a lineout entirely -- marking its
    # mean/std/covariance NaN rather than reporting from whatever's left. See
    # mcmc_postprocess._finalize_chain_selection.
    max_dropped_chain_fraction: 0.2
  # calibration_uncertainty.num_draws is the number of independent MCMC chains the postprocessor runs
  # and pools -- not just "calibration draws": chains may differ by a perturbed instrument calibration
  # (tsadar/data/calibration.py, via the *_sigma fields below), by a perturbed starting point
  # (other.mcmc.init_dispersion_factor above), by both, or -- with neither configured -- only by their
  # own independent MH random-walk noise from an identical start. num_draws=1 (the default) runs a
  # single chain, matching every other config. See inverse/postprocess/mcmc_calibration.py.
  calibration_uncertainty:
    num_draws: 20
    seed: 0
    EPWDispersion_sigma: 0
    IAWDispersion_sigma: 0
    EPWoffset_sigma: 0
    IAWoffset_sigma: 0
    spect_stddev_ion_sigma: 0
    spect_stddev_ele_sigma: 0
    gain_sigma: 0.0
  include_gains: false

plotting:
  data_cbar_l: 0
  data_cbar_u: data
  detailed_breakdown: false
  ele_window_end: 660
  ele_window_start: 425
  ion_window_end: 528
  ion_window_start: 525
  n_sigmas: 3
  rolling_std_width: 5
